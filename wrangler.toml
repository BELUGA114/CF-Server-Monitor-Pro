name = "monitor"
main = "src/index.js"
compatibility_date = "2026-06-05"

[secrets]
required = ["API_SECRET"]

# 告诉 Cloudflare 该项目需要一个 D1 数据库，绑定名称必须是 DB
[[d1_databases]]
binding = "DB"
database_name = "monitor_db" # 默认数据库名称，用户可以在部署向导中新建或修改
database_id = "" # 留空即可，一键部署时向导会自动处理
preview_database_id = "monitor_db_local" # 仅 wrangler dev 使用；本地 D1 是 .wrangler 下的 SQLite 文件，占位值即可
